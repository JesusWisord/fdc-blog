backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow
site_url: https://fueradelclosetac.com

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "📰 Noticias"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imagen de portada", name: "coverImage", widget: "image", required: false }
      - { label: "Descripción corta", name: "excerpt", widget: "text", required: false }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "Noticias", value: "noticias" }
          - { label: "Incidencia", value: "incidencia" }
          - { label: "Alerta FDC", value: "alertafdc" }
          - { label: "Comunidad", value: "comunidad" }
          - { label: "Cultura", value: "cultura" }
      - { label: "Autor/a", name: "author", widget: "string", default: "Fuera del Clóset A. C." }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "events"
    label: "📅 Eventos"
    folder: "content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha del evento", name: "eventDate", widget: "datetime" }
      - { label: "Lugar", name: "location", widget: "string", required: false }
      - { label: "Imagen", name: "coverImage", widget: "image", required: false }
      - { label: "Descripción", name: "body", widget: "markdown" }
      - { label: "Enlace externo", name: "externalLink", widget: "string", required: false }

  - name: "gallery"
    label: "🖼️ Galería"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título del álbum", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Descripción", name: "description", widget: "text", required: false }
      - label: "Imágenes"
        name: "images"
        widget: "list"
        fields:
          - { label: "Imagen", name: "src", widget: "image" }
          - { label: "Descripción", name: "alt", widget: "string" }
